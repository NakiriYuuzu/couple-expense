name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 品質閘門只需讀取 repo，遵循最小權限原則
permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
        # 測試全程 mock supabase client，不打網路；但 src/shared/lib/supabase.ts 於
        # module load 時要求 env 存在（缺值即 throw），CI 無 .env 故注入 dummy 值。
        env:
          VITE_SUPABASE_URL: https://ci-dummy.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
