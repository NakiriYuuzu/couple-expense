name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 當發布新的 release 時觸發
  release:
    types: [published]
  # 允許手動觸發 workflow
  workflow_dispatch:

# 預設最小權限；需要寫入的 job 在 job 層級單獨提升
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 僅部署 job 需要 contents: write(peaceiris 推 gh-pages)與 pages 權限
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build
        env:
          # 設定 base URL 為 repository name
          VITE_APP_ROUTER_BASE: /${{ github.event.repository.name }}/
          # 使用 production mode
          NODE_ENV: production
          # Supabase 環境變數
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # 應用設定
          VITE_APP_TITLE: ${{ secrets.VITE_APP_TITLE }}
          VITE_APP_API_BASE: ${{ secrets.VITE_APP_API_BASE }}
          # Firebase / Web Push 環境變數；secrets 未設定時會以空值建置，前端推播功能會優雅停用
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      # SPA fallback：GitHub Pages 靜態伺服器對深層路由(history 模式)會回 404，
      # 複製 index.html 成 404.html 讓深層路由直接訪問/重新整理可正常載入
      - name: Create SPA 404 fallback
        run: cp dist/production/index.html dist/production/404.html

      - name: Deploy to GitHub Pages
        # 僅在非 PR 事件部署，避免未審查的 PR 內容 force_orphan 覆蓋正式 gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/production
          # 部署到 gh-pages 分支
          publish_branch: gh-pages
          # 防止 Jekyll 處理
          enable_jekyll: false
          # 自定義 commit 訊息
          commit_message: 'Deploy: ${{ github.sha }}'
          # 強制推送，每次都是乾淨的部署
          force_orphan: true
