name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # PR 只建置不部署；main 的分支保護要求 build-and-deploy 檢查
  pull_request:
    branches: [ main ]
  # 當發布新的 release 時觸發
  release:
    types: [published]
  # 允許手動觸發 workflow
  workflow_dispatch:

# 預設最小權限；需要寫入的 job 在 job 層級單獨提升
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # peaceiris 推送 gh-pages 分支，只需要 contents: write
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
        env:
          VITE_SUPABASE_URL: https://ci-dummy.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key

      - name: Validate deployment configuration
        if: github.event_name != 'pull_request'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo '::error::Missing VITE_SUPABASE_URL'; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo '::error::Missing VITE_SUPABASE_ANON_KEY'; exit 1; }

      - name: Build project
        run: bun run build
        env:
          # 設定 base URL 為 repository name
          VITE_APP_ROUTER_BASE: /${{ github.event.repository.name }}/
          # 使用 production mode
          NODE_ENV: production
          # Supabase 環境變數
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # 應用設定
          VITE_APP_TITLE: ${{ secrets.VITE_APP_TITLE }}
          VITE_APP_API_BASE: ${{ secrets.VITE_APP_API_BASE }}
          # Firebase / Web Push 環境變數；secrets 未設定時會以空值建置，前端推播功能會優雅停用
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      # SPA fallback：GitHub Pages 靜態伺服器對深層路由(history 模式)會回 404，
      # 複製 index.html 成 404.html 讓深層路由直接訪問/重新整理可正常載入
      - name: Create SPA 404 fallback
        run: cp dist/production/index.html dist/production/404.html

      - name: Deploy to GitHub Pages
        # 僅在非 PR 事件部署，避免未審查的 PR 內容覆蓋正式 gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/production
          # 部署到 gh-pages 分支
          publish_branch: gh-pages
          # 防止 Jekyll 處理
          enable_jekyll: false
          # 自定義 commit 訊息
          commit_message: 'Deploy: ${{ github.sha }}'
          # 強制推送，每次都是乾淨的部署
          force_orphan: true
