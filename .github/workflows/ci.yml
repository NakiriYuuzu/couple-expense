name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 品質閘門只需讀取 repo，遵循最小權限原則
permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
        # 測試全程 mock supabase client，不打網路；但 src/shared/lib/supabase.ts 於
        # module load 時要求 env 存在（缺值即 throw），CI 無 .env 故注入 dummy 值。
        env:
          VITE_SUPABASE_URL: https://ci-dummy.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key

      - name: Build
        run: bun run build
        env:
          VITE_APP_ROUTER_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: https://ci-dummy.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
